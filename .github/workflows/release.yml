# Publishes a tagged version to PyPI.
#
# There is no password and no API token anywhere in this repository, on anyone's
# machine, or in GitHub's secrets. Publishing uses PyPI's trusted publishing: PyPI
# is told once that this specific workflow, in this specific repository, may publish
# this specific project, and GitHub proves the job's identity at run time. Nothing
# is stored, so nothing can leak, and a stolen token cannot exist because there is
# no token.
#
# It runs only on a version tag, and only after the full test suite passes on the
# exact commit being published. A release that cannot pass its own tests does not
# reach anybody.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  guard:
    name: Tag is current main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse a tag not pointing at current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          tag_commit="$(git rev-list -n 1 "$GITHUB_REF")"
          main_commit="$(git rev-parse FETCH_HEAD)"
          if [ "$tag_commit" != "$main_commit" ]; then
            echo "::error::Tag commit $tag_commit is not current main $main_commit"
            exit 1
          fi

  test:
    name: Test before publishing anything
    needs: guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  build:
    name: Build the distribution
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build twine hatchling
      - run: python -m build
      - run: twine check dist/*
      - run: python scripts/audit_public_artifacts.py --root . --dist dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: dist/

  publish:
    name: Publish to PyPI
    needs: [guard, test, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # the only permission trusted publishing needs
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distribution
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
